services:
  mysql:
    image: mysql:8.4
    container_name: rendiapp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rendiapp}
      MYSQL_USER: ${MYSQL_USER:-rendiapp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rendiapp_pass123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: dockerfile.dev
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"
      - "19000:19000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE:-rendiapp}
      - MYSQL_USER=${MYSQL_USER:-rendiapp_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-rendiapp_pass123}
    stdin_open: true
    tty: true

volumes:
  mysql_data:
